name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the toolchain
        run: uv sync --frozen

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Lint, type-check, and test
        run: make check

      - name: Report which requirements this build demonstrates
        run: uv run ledger verify-requirements
